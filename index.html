<!-- Vista Planificador -->
            <section id="planner" class="view">
                <div class="view-header">
                    <h2>Planificador de Entrenamiento</h2>
                    <p>Programa tus próximas sesiones de grappling o S&C.</p>
                </div>
                <div class="card">
                    <form id="plannerForm">
                        <div style="display: flex; flex-direction: column; gap: 1rem;">
                            <label>Fecha y Hora: <input type="datetime-local" id="planDate" required style="background: #050505; color: white; border: 1px solid #222; padding: 0.5rem; border-radius: 6px;"></label>
                            <label>Modalidad: 
                                <select id="planModalidad" style="background: #050505; color: white; border: 1px solid #222; padding: 0.5rem; border-radius: 6px;">
                                    <option value="BJJ Gi">BJJ Gi</option>
                                    <option value="BJJ No-Gi">BJJ No-Gi</option>
                                    <option value="Wrestling">Wrestling</option>
                                    <option value="Sparring / Open Mat">Sparring / Open Mat</option>
                                    <option value="Preparación Física">Preparación Física</option>
                                </select>
                            </label>
                            <label>Objetivo principal: <input type="text" id="planObjetivo" placeholder="Ej. Retención de guardia cerrada" style="background: #050505; color: white; border: 1px solid #222; padding: 0.5rem; border-radius: 6px;"></label>
                            <button type="submit" class="btn-primary">Programar Sesión</button>
                        </div>
                    </form>
                </div>
                <div style="margin-top: 1.5rem;">
                    <h3>Sesiones Planificadas</h3>
                    <div id="plannedList" style="margin-top: 1rem; display: flex; flex-direction: column; gap: 0.75rem;"></div>
                </div>
            </section>

            <!-- Vista Registro de Sesiones BJJ -->
            <section id="sessions" class="view">
                <div class="view-header">
                    <h2>Registro de Sesiones BJJ</h2>
                    <p>Guarda el detalle de lo entrenado, rounds y RPE.</p>
                </div>
                <div class="card">
                    <form id="sessionForm">
                        <div style="display: flex; flex-direction: column; gap: 1rem;">
                            <label>Fecha: <input type="date" id="sessDate" required style="background: #050505; color: white; border: 1px solid #222; padding: 0.5rem; border-radius: 6px;"></label>
                            <label>Modalidad: 
                                <select id="sessModalidad" style="background: #050505; color: white; border: 1px solid #222; padding: 0.5rem; border-radius: 6px;">
                                    <option value="BJJ Gi">BJJ Gi</option>
                                    <option value="BJJ No-Gi">BJJ No-Gi</option>
                                    <option value="Wrestling">Wrestling</option>
                                    <option value="Sparring / Open Mat">Sparring / Open Mat</option>
                                </select>
                            </label>
                            <label>Duración (minutos): <input type="number" id="sessDuration" value="90" style="background: #050505; color: white; border: 1px solid #222; padding: 0.5rem; border-radius: 6px;"></label>
                            <label>Intensidad percibida (RPE 1-10): <input type="number" id="sessRPE" min="1" max="10" value="8" style="background: #050505; color: white; border: 1px solid #222; padding: 0.5rem; border-radius: 6px;"></label>
                            <label>Observaciones / Notas: <textarea id="sessNotes" placeholder="Técnicas practicadas, sensaciones..." style="background: #050505; color: white; border: 1px solid #222; padding: 0.5rem; border-radius: 6px; height: 80px;"></textarea></label>
                            <button type="submit" class="btn-primary">Guardar Sesión Realizada</button>
                        </div>
                    </form>
                </div>
                <div style="margin-top: 1.5rem;">
                    <h3>Historial de Sesiones</h3>
                    <div id="sessionsList" style="margin-top: 1rem; display: flex; flex-direction: column; gap: 0.75rem;"></div>
                </div>
            </section>
